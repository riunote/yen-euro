<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>円 € 比較</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>円 € 比較</h1>
    <p>計算比較</p>
  </header>
  <input type="number" id="num">
  <button onclick="calc()">計算</button>

  <script>
  function calc() {
    let x = document.getElementById("num").value; // ← 入力値を取る
    alert("日本円で" + x);
  }
  </script>
  
</body>

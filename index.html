<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>円 € 比較</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>円 € 比較</h1>
    <p>計算比較</p>
  </header>
  <input type="number" id="num" placeholder="数字を入力">
  <button onclick="calc()">計算</button>
  <p id="result"></p> <!-- ← 出力先 -->

  <script>
  function calc() {
    let x = Number(document.getElementById("num").value);
    let y = x;
    document.getElementById("result").innerText = "結果: "+ (y + x);
  }
</script>

  
</body>
</html>
